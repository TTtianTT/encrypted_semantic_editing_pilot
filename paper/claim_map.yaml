# claim_map.yaml — maintained by the lead (PLAN A5, appendix B). Initial draft by Claude Code from PLAN A2; the lead owns and edits it.
# Each claim: id, nature (confirmed / exploratory / partial / pending), predictions (round/id of locked predictions), figures, and
# numbers: macro (LaTeX name, letters only), file (repo-relative) + path (JSON path, '/'-separated; list indices as integers) or
# derived (a named computation in scripts/build_claims.py), fmt (python format), note.
# build_claims.py resolves every number from the locked results and writes claims.yaml and generated/numbers.tex.

rounds:
  v1: {dir: experiments/symmetry_composability_v1, predictions: results/e1_predictions.json}
  v2: {dir: experiments/composability_mechanisms_v1, predictions: results/predictions.json}
  v3: {dir: experiments/composability_mechanisms_v2, predictions: results/predictions.json}
  v4: {dir: experiments/composability_mechanisms_v3, predictions: results/predictions.json}
  v5: {dir: experiments/composability_mechanisms_v4, predictions: results/predictions.json}
  v6: {dir: experiments/composability_mechanisms_v5, predictions: results/predictions.json}
  v7: {dir: experiments/composability_mechanisms_v6, predictions: results/predictions.json}

claims:
  - id: CL1
    zh: 单步解码正确 ≠ 可组合
    en: A latent edit that decodes correctly in one step need not compose.
    nature: confirmed
    predictions: [v1/P5, v2/G2_0, v5/G5_0]
    figures: [fig1]
    numbers:
      - {macro: CLoneVoneCOneRtwoMax, derived: v1_c1_r2_max, fmt: '{:.2f}', note: 'v1 C1, max over domains x seeds of R_2'}
      - {macro: CLoneVtwoRRRRtwoNMin, derived: v2_g20_rrr16_min, fmt: '{:.2f}', note: 'v2 G2-0, min over domains of RRR-16 R_2N'}
      - {macro: CLoneVfiveCOneRtwoMax, derived: v5_g50_c1_max, fmt: '{:.2f}', note: 'v5 G5-0, v1 C1 R_2 (BART weekday/month x 3 seeds), max'}
      - {macro: CLoneVfiveBaseMin, derived: v5_g50_base_min, fmt: '{:.2f}', note: 'v5 G5-0, base operator plus R_2N, min over 10 (backbone, domain)'}
      - {macro: CLoneVfiveCOneRoneMin, derived: v5_c1v1_r1_min, fmt: '{:.2f}', note: 'v5 L, BART C1v1 cells (one-way paths), min step-1 decoded success'}
  - id: CL2
    zh: CE 编辑器写的是指令，不是状态
    en: Decoder-trained (CE) editors write instructions, not states.
    nature: confirmed
    predictions: [v2/M1, v2/M2, v2/M3, v5/L3b]
    figures: [fig5]
    numbers:
      - {macro: CLtwoWriteCosSource, file: experiments/composability_mechanisms_v1/results/predictions.json, path: M1/median, fmt: '{:.3f}', note: 'median cosine of writes across source states'}
      - {macro: CLtwoWriteCosCanon, file: experiments/composability_mechanisms_v1/results/predictions.json, path: M2/median, fmt: '{:.3f}', note: 'median cosine with the canonical write'}
      - {macro: CLtwoProbeSource, file: experiments/composability_mechanisms_v1/results/predictions.json, path: M3/median_source, fmt: '{:.2f}'}
      - {macro: CLtwoCECells, file: experiments/composability_mechanisms_v4/results/predictions.json, path: L/L3/L3b/n, fmt: '{:d}'}
      - {macro: CLtwoSlotStaysBart, derived: v5_ce_slot_stays_bart, fmt: '{:d}', note: 'worlds (of 160) whose step-1 slot readout equals the start, BART weekday C1v1_s42 plus'}
      - {macro: CLtwoSlotStaysTfive, derived: v5_ce_slot_stays_t5, fmt: '{:d}', note: 'same, T5Gemma month C1U4n_s42 plus'}
  - id: CL2b
    zh: 解码器原生会做的运算写相对指令，否则写目标 token
    en: Where the decoder natively performs the operation the write is relative; otherwise it is the target token.
    nature: exploratory
    predictions: [v3/N2, v3/N3]
    numbers:
      - {macro: CLtwobRelWeekday, file: experiments/composability_mechanisms_v3/results/patch/p5_transplant_bart.json, path: weekday~1median/classes/relative, fmt: '{:.2f}', note: 'v4 P5 transplant, BART, fraction relative'}
      - {macro: CLtwobRelMonth, file: experiments/composability_mechanisms_v3/results/patch/p5_transplant_bart.json, path: month~1median/classes/relative, fmt: '{:.2f}'}
      - {macro: CLtwobRelOtherMax, derived: v4_p5_bart_other_rel_max, fmt: '{:.2f}', note: 'BART compass, egoside, daysago: largest relative fraction'}
      - {macro: CLtwobRelTfiveMin, derived: v4_p5_t5_rel_min, fmt: '{:.2f}'}
  - id: CL3
    zh: 只用解码器监督，展开训练只学到计步捷径
    en: Unrolled training with decoder supervision only learns a step-counting shortcut.
    nature: confirmed
