  - id: CL13
    zh: 绑定类编辑：两层、8 步展开的编辑器在 8 个 seed 中有 5 个撑过 30 步，100 步时全部衰减；视野对齐的 oracle 也衰减；v6 的 K2 在新 seed 上没有复现
    en: Binding edits do not compose over long chains - a two-layer editor trained on 8-step unrolls survives 30 steps on 5 of 8 seeds and decays on all by 100 steps; a horizon-matched oracle-routing editor decays too.
    nature: decided (v7 K5 H-slow-decay, K7 H-unrepresentable; K6 mixed); v6 K2 (H-closure) did not replicate on new seeds; mechanism exploratory
    predictions: [v5/B2, v5/B3, v6/K1, v6/K2, v6/K3, v6/K4, v7/K5, v7/K6, v7/K7]
    figures: [figS2, figS3]
